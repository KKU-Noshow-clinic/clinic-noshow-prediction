[project]
name = "clinic-noshow-prediction"
version = "0.1.0"
description = "Clinic Appointment No-Show Prediction - CP413008 ML Engineering for Production"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy",
    "pyarrow",
    "pyyaml",
    "requests",
    "kagglehub",
    "scikit-learn",
    "lightgbm",
    "pandera",
    "mlflow",
    "prefect",
    "evidently",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "prometheus-client",
    "shap>=0.51.0",
]

[dependency-groups]
dev = ["ruff", "pytest", "httpx", "locust"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noshow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
