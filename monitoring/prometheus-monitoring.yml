global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: clinic-noshow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: clinic-noshow-batch-monitor
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
